download-external-modules: true
quiet: true
skip-check:
  # Github: Ensure top-level permissions are not set to write-all
  - CKV2_GHA_1
  # Ensure AWS Lambda function is configured to validate code-signing
  - CKV_AWS_272
  # Function URLs are disabled
  - CKV_AWS_258
  # X-Ray tracing is enabled for Lambda (matches existing tfsec:ignore in main.tf)
  - CKV_AWS_50
  # Ensure CloudWatch log groups retains logs for at least 1 year (14 days is a deliberate cost-conscious default)
  - CKV_AWS_338
  # Ensure Terraform module sources use a commit hash (not applicable to registry-sourced modules, which pin via `version` instead)
  - CKV_TF_1
